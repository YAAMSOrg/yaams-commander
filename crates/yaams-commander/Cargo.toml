[package]
name = "yaams-commander"
description = "Desktop operations client for YAAMS virtual airlines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
yaams-api.workspace = true
chrono.workspace = true
serde.workspace = true
tokio.workspace = true
dirs = "7"
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced"] }
open = "5"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
lucide-icons = "1"

[dev-dependencies]
tempfile = "3"
iced_test = "0.14"
serde_json = "1"

[package.metadata.packager]
product-name = "YAAMS Commander"
identifier = "org.yaams.commander"
category = "Utility"
description = "Desktop operations client for YAAMS virtual airlines"
authors = ["YAAMS contributors"]
out-dir = "../../dist"
before-packaging-command = "cargo build --release -p yaams-commander"
icons = [
    "assets/icons/icon-32.png",
    "assets/icons/icon-128.png",
    "assets/icons/icon-256.png",
    "assets/icons/icon-512.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
