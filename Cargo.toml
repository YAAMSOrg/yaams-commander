[workspace]
resolver = "3"
members = ["crates/yaams-api", "crates/yaams-commander"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/YAAMSOrg/yaams-commander"
rust-version = "1.88"

[workspace.dependencies]
yaams-api = { path = "crates/yaams-api" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
