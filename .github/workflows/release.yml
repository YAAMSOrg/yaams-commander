name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app,dmg
          - os: windows-latest
            formats: nsis,wix
          - os: ubuntu-latest
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - working-directory: crates/yaams-commander
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: yaams-commander-${{ runner.os }}
          path: dist/*
